<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sprachtrainer</title><style>body{font-family:system-ui,sans-serif;background:#f2f5f8;color:#18232f;margin:0}main{max-width:600px;margin:30px auto;padding:20px}.card{background:white;padding:24px;border-radius:20px;box-shadow:0 5px 22px #18232f12}h1{margin:0 0 8px}p{color:#52606e}button,select{font:inherit;padding:13px 16px;border-radius:12px;border:1px solid #cbd5e1;background:white}button{cursor:pointer}button.primary{background:#146b5a;color:white;border:0}button:disabled{opacity:.5}.stack{display:grid;gap:12px}.mode{display:flex;justify-content:space-between;align-items:center;text-align:left;gap:12px;width:100%}.mode strong{display:block}.mode small{display:block;color:#64748b;margin-top:4px}.answers{display:grid;gap:10px;margin:20px 0}.answers button{text-align:left}.right{background:#d6f5df!important}.wrong{background:#ffdddd!important}.muted{font-size:.9rem;color:#64748b}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.hidden,[hidden]{display:none!important}#review-list{padding-left:22px}#review-list li{line-height:1.5}#review-list small{color:#64748b}</style></head><body><main><div class="card stack"><h1>🌍 Sprachtrainer</h1><p id="intro">Welche Sprache möchtest du lernen?</p><div id="language-screen" class="stack"><label>Sprache <select id="language"></select></label><button class="primary" id="choose-language">Weiter →</button></div><div id="menu" class="stack hidden"><button id="language-back">← Sprachauswahl</button><button id="mode-words" class="mode"><span><strong>📚 Wörter</strong><small>Vokabeln üben</small></span><span>→</span></button><button id="mode-sentences" class="mode"><span><strong>💬 Sätze</strong><small>Alltagssituationen üben</small></span><span>→</span></button><button id="mode-grammar" class="mode"><span><strong>✏️ Grammatik</strong><small>Formen verstehen und üben</small></span><span>→</span></button><p id="mode-message" class="muted" role="status" aria-live="polite"></p></div><div id="setup" class="stack hidden"><button id="setup-back">← Übungsarten</button><label id="category-filter-label" class="hidden"><span id="filter-title">Situation</span> <select id="category-filter"></select></label><label id="direction-label">Richtung <select id="direction"><option value="de">Deutsch → Lernsprache</option><option value="target">Lernsprache → Deutsch</option></select></label><button class="primary" id="start">Lernen starten</button></div><div id="game" class="hidden"><div class="row"><button id="back">← Übungsarten</button><span id="stats" class="muted"></span></div><p id="category" class="muted"></p><h2 id="question"></h2><div id="answers" class="answers"></div><p id="feedback" aria-live="polite"></p><button id="next" class="primary hidden">Weiter →</button><p><button id="finish">Runde beenden · Fehler ansehen</button></p></div><div id="review" class="hidden"><h2>Rundenauswertung</h2><p id="review-stats" aria-live="polite"></p><ul id="review-list" class="stack"></ul><div class="row"><button id="repeat-mistakes" class="primary">Fehler wiederholen</button><button id="new-round">Neue Runde</button><button id="review-back">← Übungsarten</button></div></div></div></main><script src="languages.js?v=20260927-3"></script><script src="app.js?v=20260927-9"></script></body></html>
